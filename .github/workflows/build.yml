name: Build Vibration APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Clean Obsolete Files
        run: |
          rm -f app/src/main/java/com/vibration/lite/core/PlayStoreActivity.java
          rm -f app/src/main/java/com/vibration/lite/core/GameUpdateManager.java
          rm -f app/src/main/java/com/vibration/lite/core/StubActivity.java
          rm -f app/src/main/res/layout/activity_play_store.xml

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --info --stacktrace

      - name: Prepare Standalone APK Asset
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/*.apk release-output/Vibration-v1.0.apk

      - name: Upload Vibration APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibration-v1.0-debug
          path: release-output/Vibration-v1.0.apk
          retention-days: 14

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0-release
          name: "Vibration v1.0 (Direct APK Download)"
          body: |
            ### Vibration v1.0 - Ultra-Performance Virtual Space & App Cloner
            - **Direct APK**: Tap `Vibration-v1.0.apk` below to download and install directly on Android.
            - **Zero Extraction Required**: Directly installable package.
            - **eFootball 2025 Ready**: 60 FPS Turbo booster & virtual sandbox.
            - **Google Play Store & GMS**: Integrated sandbox container.
          files: release-output/Vibration-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
