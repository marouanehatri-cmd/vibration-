name: Build Vibration APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Clean Obsolete Files
        run: |
          rm -f app/src/main/java/com/vibration/lite/core/PlayStoreActivity.java
          rm -f app/src/main/java/com/vibration/lite/core/GameUpdateManager.java
          rm -f app/src/main/java/com/vibration/lite/core/StubActivity.java
          rm -f app/src/main/res/layout/activity_play_store.xml

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --info --stacktrace

      - name: Upload Vibration APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibration-v1.0-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
