name: Build Vibration APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Ensure Resources and Clean Build Configuration
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/layout app/src/main/res/values

          cat << "EOF" > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "Vibration"
          include ":app"
          EOF

          cat << "EOF" > build.gradle
          plugins { id "com.android.application" version "8.1.4" apply false }
          EOF

          cat << "EOF" > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << "EOF" > app/build.gradle
          plugins { id "com.android.application" }
          android {
              namespace "com.vibration.lite"
              compileSdk 33
              defaultConfig {
                  applicationId "com.vibration.lite"
                  minSdk 28
                  targetSdk 33
                  versionCode 1
                  versionName "1.0.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          configurations.all {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
          }
          dependencies {
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "com.google.android.material:material:1.9.0"
              implementation "androidx.constraintlayout:constraintlayout:2.1.4"
          }
          EOF

          cat << "EOF" > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#07080E" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#38BDF8" android:strokeWidth="3.5" android:strokeLineCap="round" android:pathData="M34,40 A20,20 0 0,0 34,68" />
              <path android:strokeColor="#3B82F6" android:strokeWidth="3.5" android:strokeLineCap="round" android:pathData="M27,34 A30,30 0 0,0 27,74" />
              <path android:strokeColor="#C084FC" android:strokeWidth="3.5" android:strokeLineCap="round" android:pathData="M74,40 A20,20 0 0,1 74,68" />
              <path android:strokeColor="#A855F7" android:strokeWidth="3.5" android:strokeLineCap="round" android:pathData="M81,34 A30,30 0 0,1 81,74" />
              <path android:fillColor="#38BDF8" android:pathData="M38,32 L46,32 L58,76 L50,76 Z" />
              <path android:fillColor="#A855F7" android:pathData="M58,76 L70,42 C74,34 78,32 82,32 C76,34 68,38 64,52 L58,68 Z" />
          </vector>
          EOF

          for d in mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p app/src/main/res/$d
              cp app/src/main/res/drawable/ic_launcher.xml app/src/main/res/$d/ic_launcher.xml
          done

          cat << "EOF" > app/src/main/res/drawable/card_glass_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="14dp"/><solid android:color="#121626"/><stroke android:width="1dp" android:color="#242B42"/></shape>
          EOF

          cat << "EOF" > app/src/main/res/drawable/badge_pill_bg.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="24dp"/><solid android:color="#1A1830"/><stroke android:width="1dp" android:color="#4C1D95"/></shape>
          EOF

          cat << "EOF" > app/src/main/res/drawable/dot_green.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval"><solid android:color="#10B981"/></shape>
          EOF

          cat << "EOF" > app/src/main/res/layout/activity_play_store.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#07080E">
              <WebView android:id="@+id/webViewPlayStore" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" />
              <Button android:id="@+id/btnDirectPlayStore" android:layout_width="match_parent" android:layout_height="56dp" android:text="Open in Play Store App" />
          </LinearLayout>
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Vibration APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibration-v1.0-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
