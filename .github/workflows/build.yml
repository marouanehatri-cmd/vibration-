name: Build Vibration APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Configure Android SDK and Ensure Missing Files Exist
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/vibration/lite/core

          # 1. Auto-create card_glass_bg.xml if missing
          if [ ! -f app/src/main/res/drawable/card_glass_bg.xml ]; then
            cat << 'EOF' > app/src/main/res/drawable/card_glass_bg.xml
            <shape xmlns:android="http://schemas.android.com/apk/res/android">
                <corners android:radius="14dp" />
                <solid android:color="#121626" />
                <stroke android:width="1dp" android:color="#242B42" />
            </shape>
          EOF
          fi

          # 2. Auto-create badge_pill_bg.xml if missing
          if [ ! -f app/src/main/res/drawable/badge_pill_bg.xml ]; then
            cat << 'EOF' > app/src/main/res/drawable/badge_pill_bg.xml
            <shape xmlns:android="http://schemas.android.com/apk/res/android">
                <corners android:radius="24dp" />
                <solid android:color="#1A1830" />
                <stroke android:width="1dp" android:color="#4C1D95" />
            </shape>
          EOF
          fi

          # 3. Auto-create dot_green.xml if missing
          if [ ! -f app/src/main/res/drawable/dot_green.xml ]; then
            cat << 'EOF' > app/src/main/res/drawable/dot_green.xml
            <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
                <solid android:color="#10B981" />
            </shape>
          EOF
          fi

          # 4. Auto-create your exact neon Vibration Logo vector if missing
          if [ ! -f app/src/main/res/drawable/logo_vibration.xml ]; then
            cat << 'EOF' > app/src/main/res/drawable/logo_vibration.xml
            <vector xmlns:android="http://schemas.android.com/apk/res/android"
                android:width="120dp" android:height="120dp"
                android:viewportWidth="120" android:viewportHeight="120">
                <path android:fillColor="#0D0E15" android:pathData="M16,0 L104,0 A16,16 0 0,1 120,16 L120,104 A16,16 0 0,1 104,120 L16,120 A16,16 0 0,1 16,0 Z" />
                <path android:strokeColor="#38BDF8" android:strokeWidth="3.5" android:strokeLineCap="round" android:fillColor="#00000000" android:pathData="M38,44 A24,24 0 0,0 38,76" />
                <path android:strokeColor="#3B82F6" android:strokeWidth="3.5" android:strokeLineCap="round" android:fillColor="#00000000" android:pathData="M30,37 A36,36 0 0,0 30,83" />
                <path android:strokeColor="#2563EB" android:strokeWidth="3.5" android:strokeLineCap="round" android:fillColor="#00000000" android:pathData="M23,30 A48,48 0 0,0 23,90" />
                <path android:strokeColor="#C084FC" android:strokeWidth="3.5" android:strokeLineCap="round" android:fillColor="#00000000" android:pathData="M82,44 A24,24 0 0,1 82,76" />
                <path android:strokeColor="#A855F7" android:strokeWidth="3.5" android:strokeLineCap="round" android:fillColor="#00000000" android:pathData="M90,37 A36,36 0 0,1 90,83" />
                <path android:strokeColor="#9333EA" android:strokeWidth="3.5" android:strokeLineCap="round" android:fillColor="#00000000" android:pathData="M97,30 A48,48 0 0,1 97,90" />
                <path android:fillColor="#38BDF8" android:pathData="M34,35 L42,35 L60,85 L52,85 Z" />
                <path android:strokeColor="#0D0E15" android:strokeWidth="2" android:pathData="M40,36 L52,70" />
                <path android:fillColor="#A855F7" android:pathData="M60,85 L74,48 C78,38 84,35 88,35 C82,37 72,42 66,58 L60,75 Z" />
                <path android:fillColor="#6366F1" android:pathData="M52,85 L60,88 L68,75 L60,85 Z" />
            </vector>
          EOF
          fi
          if [ ! -f app/src/main/res/drawable/ic_launcher.xml ]; then
            cp app/src/main/res/drawable/logo_vibration.xml app/src/main/res/drawable/ic_launcher.xml
          fi

          # 5. Auto-create activity_play_store.xml if missing
          if [ ! -f app/src/main/res/layout/activity_play_store.xml ]; then
            cat << 'EOF' > app/src/main/res/layout/activity_play_store.xml
            <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
                xmlns:app="http://schemas.android.com/apk/res-auto"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:background="#0A0B10">
                <LinearLayout
                    android:id="@+id/headerStore"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical"
                    android:background="#121524"
                    android:padding="16dp"
                    app:layout_constraintTop_toTopOf="parent">
                    <LinearLayout
                        android:layout_width="match_parent"
                        android:layout_height="wrap_content"
                        android:orientation="horizontal"
                        android:gravity="center_vertical">
                        <TextView
                            android:layout_width="0dp"
                            android:layout_height="wrap_content"
                            android:layout_weight="1"
                            android:text="GOOGLE PLAY STORE HUB"
                            android:textColor="#FFFFFF"
                            android:textSize="15sp"
                            android:textStyle="bold" />
                        <com.google.android.material.button.MaterialButton
                            android:id="@+id/btnRefresh"
                            style="@style/Widget.MaterialComponents.Button.TextButton"
                            android:layout_width="wrap_content"
                            android:layout_height="wrap_content"
                            android:text="Refresh"
                            android:textColor="#A855F7" />
                    </LinearLayout>
                    <TextView
                        android:id="@+id/tvStoreStatus"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:text="Ready"
                        android:textColor="#9CA3AF"
                        android:textSize="12sp" />
                </LinearLayout>
                <ProgressBar
                    android:id="@+id/progressBarLoading"
                    style="?android:attr/progressBarStyleHorizontal"
                    android:layout_width="match_parent"
                    android:layout_height="4dp"
                    android:progressTint="#8B5CF6"
                    android:visibility="gone"
                    app:layout_constraintTop_toBottomOf="@id/headerStore" />
                <WebView
                    android:id="@+id/webViewPlayStore"
                    android:layout_width="match_parent"
                    android:layout_height="0dp"
                    app:layout_constraintTop_toBottomOf="@id/progressBarLoading"
                    app:layout_constraintBottom_toTopOf="@id/bottomActions" />
                <LinearLayout
                    android:id="@+id/bottomActions"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="horizontal"
                    android:background="#121524"
                    android:padding="12dp"
                    app:layout_constraintBottom_toBottomOf="parent">
                    <com.google.android.material.button.MaterialButton
                        android:id="@+id/btnDirectPlayStore"
                        android:layout_width="match_parent"
                        android:layout_height="52dp"
                        android:text="Open in Native Play Store App ↗"
                        android:textColor="#FFFFFF"
                        app:cornerRadius="12dp"
                        app:backgroundTint="#8B5CF6" />
                </LinearLayout>
            </androidx.constraintlayout.widget.ConstraintLayout>
          EOF
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Vibration APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibration-v1.0-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
