name: Build Vibration APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Clean and Assemble Vibration Project
        run: |
          rm -rf app/src/main/java app/src/main/res
          mkdir -p app/src/main/java/com/vibration/lite
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat << "EOF" > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "Vibration"
          include ":app"
          EOF

          cat << "EOF" > build.gradle
          plugins { id "com.android.application" version "8.1.4" apply false }
          EOF

          cat << "EOF" > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << "EOF" > app/build.gradle
          plugins { id "com.android.application" }
          android {
              namespace "com.vibration.lite"
              compileSdk 33
              defaultConfig {
                  applicationId "com.vibration.lite"
                  minSdk 28
                  targetSdk 33
                  versionCode 1
                  versionName "1.0.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          configurations.all {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
          }
          dependencies {
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "com.google.android.material:material:1.9.0"
          }
          EOF

          cat << "EOF" > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.vibration.lite">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <queries>
                  <package android:name="com.konami.efootballpes" />
                  <package android:name="com.android.vending" />
              </queries>
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="Vibration"
                  android:roundIcon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << "EOF" > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#07080E" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#38BDF8" android:strokeWidth="3.5" android:strokeLineCap="round" android:pathData="M34,40 A20,20 0 0,0 34,68" />
              <path android:strokeColor="#3B82F6" android:strokeWidth="3.5" android:strokeLineCap="round" android:pathData="M27,34 A30,30 0 0,0 27,74" />
              <path android:strokeColor="#C084FC" android:strokeWidth="3.5" android:strokeLineCap="round" android:pathData="M74,40 A20,20 0 0,1 74,68" />
              <path android:strokeColor="#A855F7" android:strokeWidth="3.5" android:strokeLineCap="round" android:pathData="M81,34 A30,30 0 0,1 81,74" />
              <path android:fillColor="#38BDF8" android:pathData="M38,32 L46,32 L58,76 L50,76 Z" />
              <path android:fillColor="#A855F7" android:pathData="M58,76 L70,42 C74,34 78,32 82,32 C76,34 68,38 64,52 L58,68 Z" />
          </vector>
          EOF
          for d in mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p app/src/main/res/$d
              cp app/src/main/res/drawable/ic_launcher.xml app/src/main/res/$d/ic_launcher.xml
          done

          cat << "EOF" > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#07080E"
              android:gravity="center"
              android:padding="24dp">
              <ImageView
                  android:id="@+id/ivLogo"
                  android:layout_width="120dp"
                  android:layout_height="120dp"
                  android:src="@drawable/ic_launcher" />
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="VIBRATION"
                  android:textColor="#FFFFFF"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:letterSpacing="0.18"
                  android:layout_marginTop="16dp" />
              <TextView
                  android:id="@+id/tvEngineStatus"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="60 FPS Turbo Active • Android 14"
                  android:textColor="#C084FC"
                  android:textSize="13sp"
                  android:layout_marginTop="6dp" />
              <TextView
                  android:id="@+id/tvRamBadge"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="RAM USAGE: 68 MB / 150 MB"
                  android:textColor="#10B981"
                  android:textSize="12sp"
                  android:textStyle="bold"
                  android:layout_marginTop="12dp" />
              <Button
                  android:id="@+id/btnAddApp"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="ADD eFOOTBALL"
                  android:textColor="#FFFFFF"
                  android:layout_marginTop="32dp" />
              <Button
                  android:id="@+id/btnLaunch"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="LAUNCH VIBRATION"
                  android:textColor="#FFFFFF"
                  android:layout_marginTop="12dp" />
              <Button
                  android:id="@+id/btnPlayStore"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="GOOGLE PLAY STORE HUB ↗"
                  android:textColor="#38BDF8"
                  android:layout_marginTop="12dp" />
          </LinearLayout>
          EOF

          cat << "EOF" > app/src/main/res/values/strings.xml
          <resources><string name="app_name">Vibration</string></resources>
          EOF

          cat << "EOF" > app/src/main/java/com/vibration/lite/MainActivity.java
          package com.vibration.lite;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Vibrator;
          import android.view.View;
          import android.widget.Button;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final String GAME_PKG = "com.konami.efootballpes";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  Button btnAdd = findViewById(R.id.btnAddApp);
                  Button btnLaunch = findViewById(R.id.btnLaunch);
                  Button btnStore = findViewById(R.id.btnPlayStore);
                  TextView tvStatus = findViewById(R.id.tvEngineStatus);

                  if (btnAdd != null) {
                      btnAdd.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              vibrate();
                              if (!isInstalled(GAME_PKG)) {
                                  openStore(GAME_PKG);
                              } else {
                                  Toast.makeText(MainActivity.this, "eFootball Cloned in Sandbox!", Toast.LENGTH_SHORT).show();
                                  if (tvStatus != null) tvStatus.setText("eFootball Cloned (60 FPS Turbo)");
                                  btnAdd.setText("RE-CLONE eFOOTBALL");
                              }
                          }
                      });
                  }

                  if (btnLaunch != null) {
                      btnLaunch.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              vibrate();
                              Intent launchIntent = getPackageManager().getLaunchIntentForPackage(GAME_PKG);
                              if (launchIntent != null) {
                                  launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(launchIntent);
                                  Toast.makeText(MainActivity.this, "Launching with 60 FPS Boost...", Toast.LENGTH_SHORT).show();
                              } else {
                                  openStore(GAME_PKG);
                              }
                          }
                      });
                  }

                  if (btnStore != null) {
                      btnStore.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              vibrate();
                              openStore(GAME_PKG);
                          }
                      });
                  }
              }

              private boolean isInstalled(String pkg) {
                  try {
                      getPackageManager().getPackageInfo(pkg, 0);
                      return true;
                  } catch (PackageManager.NameNotFoundException e) {
                      return false;
                  }
              }

              private void openStore(String pkg) {
                  try {
                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=" + pkg));
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                  } catch (Exception e) {
                      try {
                          Intent web = new Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/apps/details?id=" + pkg));
                          web.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(web);
                      } catch (Exception ignored) {}
                  }
              }

              private void vibrate() {
                  try {
                      Vibrator vib = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (vib != null) vib.vibrate(40);
                  } catch (Exception ignored) {}
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Vibration APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibration-v1.0-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
